# No schedule trigger since task 009: GitHub Actions is blocked for this account by a billing
# lock (the student plan expired in mid-November), so every scheduled run failed before it
# started. The daily run now happens on the local machine through Windows Task Scheduler
# (scripts/daily_run.bat, see README "Automatic daily run"), where Ollama also runs.
# workflow_dispatch is kept so the workflow can be started by hand once Actions works again.
name: Daily hazard digest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline regression check (saved fixtures)
        run: python harness/run.py --offline
      - name: Live run (NVE + LLM summary)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python harness/run.py
      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: out/
          retention-days: 30
